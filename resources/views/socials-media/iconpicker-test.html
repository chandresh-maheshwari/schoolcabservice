<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/js/fontawesome-iconpicker-3.0.0/dist/css/fontawesome-iconpicker.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="input-group">
            <input type="text" class="form-control" id="social_icon" readonly>
            <span class="input-group-append">
                <button type="button" class="btn btn-outline-secondary" data-icon="fas fa-home" role="iconpicker" id="iconPicker">
                    <i class="fas fa-home"></i>
                </button>
            </span>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
    <script src="/js/fontawesome-iconpicker-3.0.0/dist/js/fontawesome-iconpicker.min.js"></script>
    <script>
        $('#iconPicker').iconpicker({
            placement: 'bottom',
            container: 'body'
        });
        $('#iconPicker').on('iconpickerSelected', function(event){
            $('#social_icon').val(event.iconpickerValue);
        });
    </script>
</body>
</html>
